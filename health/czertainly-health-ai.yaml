---
- name: "Core Components"
  cert: admin.pem
  key: admin.key
  insecure: true
  components:
    - name: "Core"
      description: "CZERTAINLY Core"
      validOutput: '^{"status":"UP"}$'
      public:
        url: "https://czertainly.doma.tomasek.cz/api/v1/health/liveness"
      local:
        url: "http://localhost:8080/api/v1/health/liveness"

    - name: "CZERTAINLY Opa"
      description: "CZERTAINLY Auth Opa Sidecar"
      validOutput: '^{}$'
      local:
        url: "http://localhost:8181/health?bundle=true"

    - name: "Auth"
      description: "Auth"
      validOutput: '^Healthy$'
      local:
        url: "http://auth-service:8080/health"

    - name: "Auth OPA policies"
      description: "Auth OPA policies"
      validOutput: '.*Welcome to nginx!.*'
      local:
        url: "http://auth-opa-policies-service:8080"

    - name: "Scheduler"
      description: "Scheduler Service"
      validOutput: '^{"status":"UP"}$'
      local:
        url: "http://scheduler-service-service:8080/health/readiness"

    - name: "Frontend"
      description: "CZERTAINLY Frontend"
      validOutput: 'CZERTAINLY'
      public:
        url: "https://czertainly.doma.tomasek.cz/administrator"
      local:
        url: "http://fe-administrator-service:8080/"

    - name: "API Gateway"
      description: "Kong API Gateway"
      validOutput: '{"message":"ready"}'
      local:
        url: "http://api-gateway-service:8100/status/ready"

- name: "Connectors"
  cert: admin.pem
  key: admin.key
  insecure: true
  iterate:
    validOutput: '^{"status":"ok"}'
    public:
      url: "https://czertainly.doma.tomasek.cz/api/v1/connectors"
    local:
      url: "http://localhost:8080/api/v1/connectors"
      headers:
        - ssl-client-cert: ''